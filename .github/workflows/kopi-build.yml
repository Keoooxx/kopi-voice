name: Kopi Voice

# Compila Kopi Voice (Fabric 1.21.1) y el plugin de servidor cada vez que se sube un cambio.
# Los .jar aparecen en la pestana Actions -> la ejecucion -> "Artifacts".
on:
  push:
  workflow_dispatch:

jobs:
  client-fabric-1211:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-build
      - name: Compilar el mod (Fabric 1.21.1)
        run: ./gradlew :client:1.21.1-fabric:build --stacktrace -Pproject.client.only=1.21.1-fabric
      - name: Nombre final (sin version)
        run: |
          cd build/libs
          rm -f *-sources.jar *-dev.jar
          mv KopiVoice-fabric-1.21.1-*.jar KopiVoice-fabric-1.21.1.jar
          ls -la
      - name: Subir el mod
        uses: actions/upload-artifact@v7.0.1
        with:
          name: KopiVoice-fabric-1.21.1
          path: build/libs/KopiVoice-fabric-1.21.1.jar
          if-no-files-found: error

  server-paper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-build
      - name: Compilar el plugin de servidor (Paper)
        run: ./gradlew :server:paper:build --stacktrace -Pproject.client.disable=true
      - name: Nombre final (sin version)
        run: |
          cd build/libs
          rm -f *-sources.jar
          mv KopiVoice-Paper-*.jar KopiVoice-Paper.jar
          ls -la
      - name: Subir el plugin
        uses: actions/upload-artifact@v7.0.1
        with:
          name: KopiVoice-server-paper
          path: build/libs/KopiVoice-Paper.jar
          if-no-files-found: error

  # Publica una release con enlaces fijos y publicos:
  #   https://github.com/Keoooxx/kopi-voice/releases/latest/download/KopiVoice-fabric-1.21.1.jar
  #   https://github.com/Keoooxx/kopi-voice/releases/latest/download/KopiVoice-Paper.jar
  release:
    needs: [client-fabric-1211, server-paper]
    if: github.ref == 'refs/heads/kopi-voice'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kopi-${{ github.run_number }}
          name: Kopi Voice (compilacion ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Kopi Voice para Fabric 1.21.1 (basado en Plasmo Voice, LGPL-3.0).
            - Jugadores y servidores Fabric/Arclight: KopiVoice-fabric-1.21.1.jar en la carpeta mods (con Fabric API).
            - Servidores Paper: KopiVoice-Paper.jar en la carpeta plugins.
          files: |
            dist/KopiVoice-fabric-1.21.1.jar
            dist/KopiVoice-Paper.jar
